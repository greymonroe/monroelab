body: |
  Congratulations to **Matt Davis** for winning **Best Presentation** at the **Mutations in Time and Space (MITS) 2026** conference, held April 13–15, 2026 at the Wellcome Genome Campus in Hinxton, UK.

  MITS is a biennial international conference that brings together researchers working on somatic mutation, mosaicism, and genome evolution across systems from humans to plants. Grey served on the scientific programme committee. Matt had a great trip and represented the lab brilliantly.
