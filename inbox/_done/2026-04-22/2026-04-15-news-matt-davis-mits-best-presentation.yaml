title: "Matt Davis wins Best Presentation at Mutations in Time and Space 2026"
date: "2026-04-15"
summary: "Matt Davis won Best Presentation at the Mutations in Time and Space (MITS) 2026 conference at the Wellcome Genome Campus in Hinxton, UK."
tags:
  - awards
