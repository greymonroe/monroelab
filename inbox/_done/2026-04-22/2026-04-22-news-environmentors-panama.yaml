type: add-news
title: "Four EnvironMentors students selected for Panama International Science Fair"
date: "2026-04-22"
summary: "Four high school students from the UC Davis EnvironMentors chapter will present their research at the International Science Fair in Panama City, June 7–12, 2026."
tags:
  - environmentors
  - outreach
  - students
body: |
  Four students from the UC Davis EnvironMentors chapter — based at Pioneer High School in Woodland — have been selected to represent the chapter at the **International Science Fair in Panama City, June 7–12, 2026**. The trip is coordinated through the Global Council for Science and the Environment (GCSE).

  **Students and mentors:**

  - Marissa Bautista — mentored by Marie Klein
  - Anna Sophia — mentored by Gal Koss
  - Mudasser — mentored by Lewis Daniel and Matt Davis
  - Bareera — mentored by Shabnam Shabnam and Emilie Changeux

  Huge congratulations to the students and their mentors. EnvironMentors pairs high school students with graduate-student and postdoc mentors to design and carry out original environmental research projects over the course of the academic year.
